name: Smoke Test

# Tier 1 smoke test: install each vendor's CLI in a clean Linux runner,
# install this plugin from the repo's local files, and verify the vendor
# CLI can see the plugin / extension in its registry.
#
# This catches "plugin won't load" — wrong file paths after the copy-to-cache
# step, malformed manifests that schemas missed, etc. — without burning any
# LLM credits. Each job is offline-only (no API calls to the vendor's models).
#
# Vendors NOT covered here, and why:
#   - Cursor: GUI-only, no headless CLI exists yet
#   - GitHub Copilot CLI: doesn't accept --path <local>, can only install from
#     a github URL. Can't smoke-test a PR branch this way. Revisit when
#     local-path install lands.
#   - OpenAI Codex: marketplace install rejects plugins whose source path
#     resolves to the repository root (openai/codex#17066). Since our design
#     IS "the repo is the plugin," we can't local-smoke-test the install
#     path. The Codex CLI install itself + manifest schema validation (in
#     ci.yml) covers the offline checks. Revisit when the upstream bug is
#     fixed or if we restructure with a Codex-specific subdir.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke-claude-code:
    name: Claude Code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dev deps
        run: npm ci

      - name: Build manifests
        run: npm run build

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin layout against Claude Code (offline)
        run: claude plugin validate ./

  smoke-codex-cli:
    name: OpenAI Codex (CLI install only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dev deps
        run: npm ci

      - name: Build manifests
        run: npm run build

      - name: Install Codex CLI (smoke check)
        # We can't run the full `marketplace add` → `plugin install` flow
        # locally because Codex rejects plugin source paths that resolve to
        # the repo root (openai/codex#17066). Installing the CLI confirms
        # at least that there are no install-blocking issues with the
        # environment; manifest correctness is covered by JSON Schema
        # validation in ci.yml.
        run: |
          npm install -g @openai/codex
          codex --version

  smoke-gemini:
    name: Gemini CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Gemini CLI checks for an API key on startup even for local extension
      # commands. A dummy value lets the CLI proceed past the auth check;
      # we never actually call the model in this job.
      GEMINI_API_KEY: dummy-for-smoke-test
      # Bypass the "Do you trust the files in this folder?" interactive
      # prompt. Safe here because the workspace IS this repo's own code.
      GEMINI_CLI_TRUST_WORKSPACE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dev deps
        run: npm ci

      - name: Build manifests
        run: npm run build

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Install extension from this repo (non-interactive)
        # `source` is a positional arg (github URL or local path), not a --path flag.
        run: gemini extensions install "$GITHUB_WORKSPACE" --consent --skip-settings

      - name: Verify extension appears in `gemini extensions list`
        # Two robustness moves:
        #   1. Capture both stdout AND stderr — gemini emits some output on
        #      stderr that a plain pipe to tee would miss.
        #   2. `|| true` after the list command — gemini sometimes exits
        #      non-zero on benign warnings. We only care about whether the
        #      extension name appears in the captured output.
        run: |
          gemini extensions list > /tmp/gemini-exts.txt 2>&1 || true
          echo "--- captured output ---"
          cat /tmp/gemini-exts.txt
          echo "--- end ---"
          grep -q commercetools-ai-toolkit /tmp/gemini-exts.txt
