name: Notify docs repo

# Fires a `repository_dispatch` event (`event_type: skills-updated`) at
# `commercetools/commercetools-docs` whenever published content on `main`
# changes here, so the docs repo's `sync-skills.yml` workflow can pull the
# latest skills. Edits to README/LICENSE/.github do not trigger it.

on:
  push:
    branches: [main]
    # Only fire on published content. Keep this list mirrored with the dev repo
    # public-release.yml `add-paths` (the source of truth for what gets synced).
    paths:
      - skills/**
      - commands/**
      - .claude-plugin/**
      - .cursor-plugin/**
      - .agents/**
      - skills.sh.json

jobs:
  dispatch:
    name: Dispatch skills-updated
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Generate GitHub token (via CT SDKs App)
        id: generate_github_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CT_SDKS_APP_ID }}
          private-key: ${{ secrets.CT_SDKS_APP_PEM }}
          owner: ${{ github.repository_owner }}
          repositories: commercetools/commercetools-docs

      - name: Send repository_dispatch to commercetools-docs
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.generate_github_token.outputs.token }}
          repository: commercetools/commercetools-docs
          event-type: skills-updated
          client-payload: |
            {
              "source_repo": "${{ github.repository }}",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}"
            }
  
  notify_failure:
    name: dispatch sync-skills Slack Failure Notification
    runs-on: ubuntu-latest
    if: failure()
    needs: [dispatch]
    steps:
      - name: Notify Slack
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_COLOR: failure
          SLACK_TITLE: 'dispatch sync-skills skill sync Failed'
          SLACK_USERNAME: 'GitHub Actions'
          SLACK_CUSTOM_PAYLOAD: |
            {
              "message": "The dispatch job in the notify-docs workflow in commercetools-ai-plugins repo failed. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "branch": "${{ github.ref_name }}",
              "title": "dispatch sync-skills skill sync Failed"
            }
